name = "spartan-square-connector-sandbox"
main = "src/index.mjs"
compatibility_date = "2026-08-17"
workers_dev = true

# Intentionally no custom routes or production zone. Replace the workers.dev
# placeholder only after the isolated sandbox Worker name is reserved.

[vars]
CONNECTOR_ENVIRONMENT = "sandbox"
ALLOWED_ORIGINS = "https://replace-with-sandbox-worker.workers.dev"
SQUARE_ENVIRONMENT = "sandbox"
SQUARE_API_BASE_URL = "https://connect.squareupsandbox.com"
SQUARE_API_VERSION = "2026-07-15"
SQUARE_LOCATION_ID = "REPLACE_WITH_SQUARE_SANDBOX_LOCATION_ID"
SQUARE_DISCOUNT_CATALOG_ID = ""
SQUARE_ELIGIBLE_GROUP_ID = ""
SQUARE_REDEEMED_GROUP_ID = ""
SQUARE_QUALIFYING_VARIATION_IDS = ""
SQUARE_MERCHANT_ID = ""
SQUARE_WEBHOOK_NOTIFICATION_URL = "https://replace-with-sandbox-worker.workers.dev/api/square/webhook"
TURNSTILE_SITE_KEY = ""
TURNSTILE_EXPECTED_ACTION = "square_offer_sandbox"
SQUARE_OFFER_ENABLED = "false"
SQUARE_WEBHOOK_ENABLED = "false"
SQUARE_PASS_ENABLED = "false"
SQUARE_CONSUMER_ENABLED = "false"
SQUARE_RECONCILIATION_ENABLED = "false"
SQUARE_CANARY_ONLY = "true"
SQUARE_CANARY_SUBMISSION_IDS = ""
PASS_SESSION_TTL_SECONDS = "2592000"
PROCESSING_LEASE_SECONDS = "900"
PROCESSING_RECOVERY_LIMIT = "25"
RECONCILIATION_LOOKBACK_HOURS = "96"

[[d1_databases]]
binding = "DB"
database_name = "spartan-square-connector-sandbox"
database_id = "REPLACE_WITH_SANDBOX_D1_DATABASE_ID"
preview_database_id = "REPLACE_WITH_SANDBOX_D1_PREVIEW_DATABASE_ID"
migrations_dir = "migrations"

[[queues.producers]]
binding = "SQUARE_QUEUE"
queue = "spartan-square-connector-sandbox"

[[queues.consumers]]
queue = "spartan-square-connector-sandbox"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "spartan-square-connector-sandbox-dlq"

[triggers]
crons = ["*/5 * * * *"]
